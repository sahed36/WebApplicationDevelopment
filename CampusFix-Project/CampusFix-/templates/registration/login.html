{% extends "base.html" %}{% block title %}Login | CampusFix{% endblock %}
{% block content %}<main class="container auth-wrap"><div class="auth-card"><h2 class="fw-bold">Welcome back</h2><p class="text-secondary">Sign in to manage your campus reports.</p>{% if form.errors %}<div class="alert alert-danger">Invalid username or password.</div>{% endif %}<form method="post">{% csrf_token %}<div class="mb-3"><label class="form-label" for="id_username">Username</label><input class="form-control form-control-lg" id="id_username" name="username" required autocomplete="username"></div><div class="mb-3"><label class="form-label" for="id_password">Password</label><input class="form-control form-control-lg" id="id_password" type="password" name="password" required autocomplete="current-password"></div><input type="hidden" name="next" value="{{ next }}"><button class="btn btn-primary btn-lg w-100">Sign in</button></form><p class="mt-3 mb-0 text-center">New here? <a href="{% url 'register' %}">Create an account</a></p></div></main>{% endblock %}
